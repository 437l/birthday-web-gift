<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Real Book</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#3a2a20,#120d0a 70%);
    font-family:'Cairo',sans-serif;
    perspective:3000px;
}

/* ===== BOOK ===== */

.book-wrap{
    position:relative;
    width:430px;
    height:600px;
    transform-style:preserve-3d;
}

.book{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
}

/* ===== COVER ===== */

.cover{
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(145deg,#6e4623,#3f250f);
    border-radius:10px 18px 18px 10px;
    transform-origin:left;
    transition:1.5s cubic-bezier(.77,0,.175,1);
    z-index:100;
    box-shadow:
    inset 0 0 20px rgba(255,255,255,.08),
    inset -8px 0 15px rgba(0,0,0,.4),
    0 25px 50px rgba(0,0,0,.7);
    cursor:pointer;
    overflow:hidden;
}

.cover::before{
    content:"";
    position:absolute;
    top:0;
    right:15px;
    width:10px;
    height:100%;
    background:rgba(0,0,0,.25);
}

.cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,.02) 3px
    );
}

.cover-title{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#f8e7c6;
    text-align:center;
    padding:30px;
}

.cover-title h1{
    font-size:42px;
    margin-bottom:20px;
    letter-spacing:2px;
}

.cover-title p{
    font-size:20px;
    opacity:.9;
}

/* ===== PAGES ===== */

.page{
    position:absolute;
    width:100%;
    height:100%;
    background:#fffdf8;
    border-radius:8px 15px 15px 8px;
    transform-origin:left;
    transition:1.5s cubic-bezier(.77,0,.175,1);
    transform-style:preserve-3d;
    box-shadow:
    0 8px 20px rgba(0,0,0,.3);
    overflow:hidden;
}

.page-front,
.page-back{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    padding:45px;
}

.page-back{
    transform:rotateY(180deg);
}

.page-content{
    width:100%;
    height:100%;
    border:2px solid #e6dccf;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
    background:
    linear-gradient(to bottom,#fffdf8,#f7f0e6);
}

.page-content img{
    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.page-content h2{
    color:#3a2413;
    font-size:30px;
}

.page-content p{
    color:#4a3728;
    text-align:center;
    line-height:2;
    font-size:18px;
}

/* ===== OPEN STATES ===== */

.book.open .cover{
    transform:rotateY(-160deg);
}

.page.flipped{
    transform:rotateY(-180deg);
}

/* realistic stack */

.page:nth-child(2){ z-index:90; }
.page:nth-child(3){ z-index:80; }
.page:nth-child(4){ z-index:70; }
.page:nth-child(5){ z-index:60; }

.page:nth-child(2){ transform:translateZ(-2px); }
.page:nth-child(3){ transform:translateZ(-4px); }
.page:nth-child(4){ transform:translateZ(-6px); }
.page:nth-child(5){ transform:translateZ(-8px); }

.shadow{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.3);
    filter:blur(40px);
    transform:translateY(50px) rotateX(90deg);
    z-index:-1;
}

/* ===== MOBILE ===== */

@media(max-width:500px){

    .book-wrap{
        width:330px;
        height:500px;
    }

    .cover-title h1{
        font-size:32px;
    }

    .page-content h2{
        font-size:24px;
    }

    .page-content p{
        font-size:15px;
    }

}
</style>
</head>
<body>

<div class="book-wrap">

    <div class="shadow"></div>

    <div class="book" id="book">

        <!-- COVER -->

        <div class="cover" id="cover">
            <div class="cover-title">
                <h1>MY STORY</h1>
                <p>اضغط لفتح الكتاب</p>
            </div>
        </div>

        <!-- PAGE 1 -->

        <div class="page">
            <div class="page-front">
                <div class="page-content">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop" />
                    <h2>البداية</h2>
                    <p>
                        هون بتحط الكلام اللي بدك ياه
                        بشكل مرتب وحلو داخل الصفحة الأولى.
                    </p>
                </div>
            </div>

            <div class="page-back">
                <div class="page-content">
                    <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop" />
                    <h2>الذكرى الثانية</h2>
                    <p>
                        تقدر تضيف صور ونصوص طويلة
                        ويضل شكل الصفحة واقعي جداً.
                    </p>
                </div>
            </div>
        </div>

        <!-- PAGE 2 -->

        <div class="page">
            <div class="page-front">
                <div class="page-content">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop" />
                    <h2>صفحة ثالثة</h2>
                    <p>
                        حركة قلب الصفحات مصنوعة بـ 3D
                        وتعطي إحساس كتاب حقيقي.
                    </p>
                </div>
            </div>

            <div class="page-back">
                <div class="page-content">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop" />
                    <h2>النهاية</h2>
                    <p>
                        لما توصل لآخر صفحة
                        الكتاب رح يتسكر تلقائياً.
                    </p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const book = document.getElementById("book");
const cover = document.getElementById("cover");
const pages = document.querySelectorAll(".page");

let current = 0;
let opened = false;

book.addEventListener("click", () => {

    if(!opened){
        book.classList.add("open");
        opened = true;
        return;
    }

    if(current < pages.length){
        pages[current].classList.add("flipped");
        current++;
    }
    else{
        pages.forEach(p => p.classList.remove("flipped"));

        setTimeout(()=>{
            book.classList.remove("open");
            current = 0;
            opened = false;
        },1200);
    }

});
</script>

</body>
</html>
