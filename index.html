<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
overflow:hidden;
}

.book{
position:relative;
width:320px;
height:480px;
perspective:2000px;

/* 🔥 أهم إصلاح */
overflow:visible;
}

.page{
position:absolute;
width:100%;
height:100%;
transform-origin:left center;
transition:transform 1s ease;
transform-style:preserve-3d;
cursor:pointer;
}

.face{
position:absolute;
inset:0;
backface-visibility:hidden;
border-radius:10px;
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
background:#fffdf9;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.back{
transform:rotateY(180deg);
background:#eee;
}

.page.flipped{
transform:rotateY(-180deg);
}

img{
width:100%;
height:300px;
object-fit:cover;
}

.text{
margin-top:10px;
font-weight:bold;
color:#333;
}

.cover .face{
background:linear-gradient(135deg,#8b5e3c,#4a2a13);
color:#fff;
justify-content:center;
}

</style>
</head>

<body>

<div class="book" id="book"></div>

<script>

const data=[
{img:"https://i.imgur.com/Nmwgm8m.jpeg",txt:"أجمل الذكريات.."},
{img:"https://i.imgur.com/Nmwgm8m.jpeg",txt:"لحظات لا تنسى.."},
{img:"https://i.imgur.com/Nmwgm8m.jpeg",txt:"معك دائماً.."}
];

const book=document.getElementById("book");

let z=100;

data.forEach((item,i)=>{

const page=document.createElement("div");
page.className="page";
page.style.zIndex=z-i;

page.innerHTML=`
<div class="face">
<img src="${item.img}">
<div class="text">${item.txt}</div>
</div>
<div class="face back"></div>
`;

page.onclick=()=>{
page.classList.add("flipped");
setTimeout(()=>page.style.zIndex=0,600);
};

book.appendChild(page);

});

const cover=document.createElement("div");
cover.className="page cover";
cover.style.zIndex=200;

cover.innerHTML=`
<div class="face">
<h2>كتاب ذكرياتنا</h2>
<p>اضغط للفتح </p>
</div>
<div class="face back"></div>
`;

cover.onclick=()=>{
cover.classList.add("flipped");
};

book.appendChild(cover);

</script>

</body>
</html>
