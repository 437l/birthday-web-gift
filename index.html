<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Realistic Book</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#3c2b20,#120d0a 70%);
    font-family:'Cairo',sans-serif;
    perspective:5000px;
}

/* BOOK */

.book{
    position:relative;
    width:420px;
    height:580px;
    transform-style:preserve-3d;
}

/* SHADOW */

.shadow{
    position:absolute;
    width:460px;
    height:60px;
    background:rgba(0,0,0,.45);
    filter:blur(35px);
    border-radius:50%;
    bottom:-45px;
    left:50%;
    transform:translateX(-50%);
}

/* COVER */

.cover{
    position:absolute;
    inset:0;
    background:
    linear-gradient(145deg,#73451f,#3b210e);
    border-radius:8px 14px 14px 8px;
    transform-origin:left;
    transition:1.6s cubic-bezier(.77,0,.175,1);
    z-index:9999;
    cursor:pointer;
    overflow:hidden;

    box-shadow:
    inset 0 0 20px rgba(255,255,255,.05),
    inset -8px 0 15px rgba(0,0,0,.45),
    0 25px 60px rgba(0,0,0,.7);
}

.cover::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:16px;
    height:100%;
    background:
    linear-gradient(to right,#1e1007,#5a3418,#1e1007);
}

.cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,.02) 3px
    );
}

.cover-content{
    position:absolute;
    inset:0;
    z-index:2;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:#f4e3c2;
    text-align:center;
    padding:40px;
}

.cover-content h1{
    font-size:42px;
    margin-bottom:15px;
    letter-spacing:3px;
}

.cover-content p{
    font-size:18px;
    opacity:.85;
}

/* PAGES */

.page{
    position:absolute;
    inset:0;

    background:
    linear-gradient(to bottom,#fffdf8,#f6efe6);

    border-radius:6px 12px 12px 6px;

    transform-origin:left;

    transition:
transition:transform 1s cubic-bezier(.77,0,.175,1);

    overflow:hidden;

    padding:30px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.18);

    z-index:1;
}

/* STACK */

.page:nth-child(2){ transform:translateZ(-1px); }
.page:nth-child(3){ transform:translateZ(-2px); }
.page:nth-child(4){ transform:translateZ(-3px); }
.page:nth-child(5){ transform:translateZ(-4px); }
.page:nth-child(6){ transform:translateZ(-5px); }

/* CONTENT */

.content{
    width:100%;
    height:100%;

    border:2px solid #e9dfd0;

    padding:20px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:18px;
}

.content img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;

    box-shadow:
    0 10px 20px rgba(0,0,0,.2);
}

.content h2{
    color:#442714;
    font-size:30px;
}

.content p{
    color:#5a4331;
    text-align:center;
    line-height:2;
    font-size:17px;
}

/* OPEN */

.book.open .cover{
    transform:rotateY(-180deg);
}

/* FLIP */

.page.flip{
    transform:rotateY(-180deg);
    pointer-events:none;
}

.page.flip .content{
    opacity:0;
    transition:opacity .25s ease;
}

/* MOBILE */

@media(max-width:500px){

    .book{
        width:330px;
        height:500px;
    }

    .content img{
        height:170px;
    }

    .cover-content h1{
        font-size:30px;
    }

}

</style>
</head>
<body>

<div class="book" id="book">

    <div class="shadow"></div>

    <!-- COVER -->

    <div class="cover">
        <div class="cover-content">
            <h1>book</h1>
            <p> اكبس ع الكتاب </p>
        </div>
    </div>

    <!-- PAGE 1 -->

    <div class="page">
        <div class="content">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop">
            <h2>الصفحة الأولى</h2>
            <p>
اول صفحة
            </p>
        </div>
    </div>

    <!-- PAGE 2 -->

    <div class="page">
        <div class="content">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop">
            <h2>الصفحة الثانية</h2>
            <p>
ثاني صفحة
            </p>
        </div>
    </div>

    <!-- PAGE 3 -->

    <div class="page">
        <div class="content">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop">
            <h2>الصفحة الثالثة</h2>
            <p>
ثالث صفحة
            </p>
        </div>
    </div>

    <!-- PAGE 4 -->

    <div class="page">
        <div class="content">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop">
            <h2>النهاية</h2>
            <p>
اخر صفحة
            </p>
        </div>
    </div>

</div>

<script>

const book = document.getElementById("book");
const pages = document.querySelectorAll(".page");

let opened = false;
let currentPage = 0;

book.addEventListener("click", () => {

    if(!opened){

        book.classList.add("open");

        opened = true;

        return;
    }

    if(currentPage < pages.length){

        pages[currentPage].style.zIndex = 1000 + currentPage;

        pages[currentPage].classList.add("flip");

        currentPage++;

        return;
    }

    for(let i = pages.length - 1; i >= 0; i--){

        setTimeout(() => {

            pages[i].classList.remove("flip");

        }, (pages.length - i) * 220);

    }

    setTimeout(() => {

        book.classList.remove("open");

        currentPage = 0;

        opened = false;

    }, 1600);

});

</script>

</body>
</html>
