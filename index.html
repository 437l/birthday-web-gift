<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real 3D Book</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#3b2a1f,#120d0a 70%);
    font-family:'Cairo',sans-serif;
    perspective:5000px;
}

/* ===== BOOK ===== */

.book{
    position:relative;
    width:420px;
    height:580px;
    transform-style:preserve-3d;
}

/* ===== SHADOW ===== */

.shadow{
    position:absolute;
    width:450px;
    height:60px;
    background:rgba(0,0,0,.45);
    filter:blur(35px);
    border-radius:50%;
    bottom:-50px;
    left:50%;
    transform:translateX(-50%);
}

/* ===== COVER ===== */

.cover{
    position:absolute;
    inset:0;
    background:
    linear-gradient(145deg,#73451f,#3e220d);
    border-radius:8px 14px 14px 8px;
    transform-origin:left;
    transform-style:preserve-3d;
    transition:1.6s cubic-bezier(.77,0,.175,1);
    z-index:999;
    cursor:pointer;

    box-shadow:
    inset 0 0 25px rgba(255,255,255,.05),
    inset -8px 0 10px rgba(0,0,0,.45),
    0 20px 50px rgba(0,0,0,.7);
}

.cover::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:16px;
    height:100%;
    background:
    linear-gradient(to right,#2b1709,#5b3417,#2b1709);
}

.cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,.02) 3px
    );
    border-radius:inherit;
}

.cover-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#f4e5c3;
    z-index:2;
    text-align:center;
    padding:40px;
}

.cover-content h1{
    font-size:42px;
    margin-bottom:15px;
    letter-spacing:3px;
}

.cover-content p{
    opacity:.8;
    font-size:19px;
}

/* ===== PAGES ===== */

.page{
    position:absolute;
    width:100%;
    height:100%;
    background:#fffdf8;
    border-radius:6px 12px 12px 6px;
    transform-origin:left;
    transform-style:preserve-3d;
    transition:1.5s cubic-bezier(.77,0,.175,1);
    overflow:hidden;

    box-shadow:
    0 5px 15px rgba(0,0,0,.18);
}

/* realistic paper stack */

.page:nth-child(2){ transform:translateZ(-1px); z-index:5; }
.page:nth-child(3){ transform:translateZ(-2px); z-index:4; }
.page:nth-child(4){ transform:translateZ(-3px); z-index:3; }
.page:nth-child(5){ transform:translateZ(-4px); z-index:2; }

.front,
.back{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:
    linear-gradient(to bottom,#fffdf8,#f8f1e7);
    padding:35px;
}

.back{
    transform:rotateY(180deg);
}

.content{
    width:100%;
    height:100%;
    border:2px solid #eadfce;
    padding:22px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
}

.content img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,.18);
}

.content h2{
    color:#442613;
    font-size:28px;
}

.content p{
    text-align:center;
    color:#5c4331;
    line-height:2;
    font-size:17px;
}

/* ===== OPEN ===== */

.book.open .cover{
    transform:rotateY(-180deg);
}

/* ===== FLIP ===== */

.page.flip{
    transform:rotateY(-180deg);
}

/* ===== MOBILE ===== */

@media(max-width:500px){

    .book{
        width:330px;
        height:500px;
    }

    .content img{
        height:180px;
    }

    .cover-content h1{
        font-size:30px;
    }

}

</style>
</head>
<body>

<div class="book" id="book">

    <div class="shadow"></div>

    <!-- COVER -->

    <div class="cover" id="cover">
        <div class="cover-content">
            <h1>BOOK</h1>
            <p>اضغط على الكتاب</p>
        </div>
    </div>

    <!-- PAGE 1 -->

    <div class="page">
        <div class="front">
            <div class="content">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop">
                <h2>البداية</h2>
                <p>
صفحة الاولى
                </p>
            </div>
        </div>

        <div class="back">
            <div class="content">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop">
                <h2>الصفحة الثانية</h2>
                <p>
صفحة ثانية
                </p>
            </div>
        </div>
    </div>

    <!-- PAGE 2 -->

    <div class="page">
        <div class="front">
            <div class="content">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop">
                <h2>صفحة ثالثة</h2>
                <p>
صفحة ثالثة
                </p>
            </div>
        </div>

        <div class="back">
            <div class="content">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop">
                <h2>النهاية</h2>
                <p>
اخر صفحة
                </p>
            </div>
        </div>
    </div>

</div>

<script>

const book = document.getElementById("book");
const pages = document.querySelectorAll(".page");

let opened = false;
let currentPage = 0;

book.addEventListener("click", () => {

    /* OPEN BOOK */

    if(!opened){
        book.classList.add("open");
        opened = true;
        return;
    }

    /* FLIP PAGES */

    if(currentPage < pages.length){

        pages[currentPage].classList.add("flip");

        currentPage++;

        return;
    }

    /* CLOSE BOOK */

    pages.forEach((p,i)=>{

        setTimeout(()=>{
            p.classList.remove("flip");
        },i * 180);

    });

    setTimeout(()=>{

        book.classList.remove("open");

        currentPage = 0;
        opened = false;

    },1200);

});

</script>

</body>
</html>
