<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-gradient: linear-gradient(135deg, #89c2ff, #b8a4ff);
  --primary-color: #8ab4ff;
  --secondary-color: #b38cff;
  --text-main: #ffffff;
  --text-muted: #6b6b6b;
  --panel-bg: rgba(255, 255, 255, 0.55);
  --panel-border: rgba(138, 180, 255, 0.25);
  --btn-text: #0f172a;
  --star-color: #ff0062;
  --shadow-soft: rgba(0, 0, 0, 0.2);
  --shadow-glow: rgba(138, 180, 255, 0.6);
  --btn-gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  --btn-hover-gradient: linear-gradient(135deg, #6aa5ff, #a06fff);
  --text-glow: 0 0 8px rgba(255, 0, 98, 0.6),
               0 0 20px rgba(255, 0, 98, 0.4),
               0 0 35px rgba(255, 0, 98, 0.2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: var(--bg-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  font-family: 'Poppins', 'Cairo', sans-serif;
  perspective: 1000px;
}

#starCanvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.container {
  position: relative;
  z-index: 10;
  text-align: center;
  width: 90%;
  max-width: 550px;
}

.btn {
  padding: 16px 36px;
  border-radius: 50px;
  border: none;
  background: var(--btn-gradient);
  color: var(--btn-text);
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: var(--btn-hover-gradient);
}

#count {
  font-size: 120px;
  color: var(--primary-color);
  display: none;
}

#text {
  margin-top: 20px;
  font-size: 20px;
  display: none;
  text-shadow: var(--text-glow);
}

.message {
  margin-top: 20px;
  padding: 25px;
  border-radius: 20px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: none;
  color: #ff79b9;
}

#gallery {
  display: none;
  flex-direction: column;
  align-items: center;
}

.image-container {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  overflow: hidden;
  margin: 20px;
  box-shadow: 0 10px 40px var(--shadow-soft);
}

#image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#name {
  color: var(--primary-color);
  font-size: 22px;
  font-weight: 700;
}

#desc {
  color: var(--text-muted);
}

#endPage {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
</style>
</head>

<body>

<canvas id="starCanvas"></canvas>

<audio id="bgMusic" loop>
  <source src="https://mp3tourl.com/audio/1778104889205-d3f1bf97-6ff6-4de5-be39-7b816d0753d0.m4a">
</audio>

<div class="container">

  <div id="startView">
    <button class="btn" onclick="startSequence()">Start</button>
  </div>

  <div id="count"></div>
  <div id="text"></div>
  <div id="messageBox" class="message" onclick="openGallery()">Go to messages</div>

  <div id="gallery">
    <div class="image-container">
      <img id="image">
    </div>
    <div id="name"></div>
    <div id="desc"></div>
    <button class="btn" onclick="nextImage()">next</button>
  </div>

</div>

<div id="endPage">
  <img id="endImage">
  <div id="endText"></div>
</div>

<script src="galleryData.js"></script>

<script>
let currentIndex = 0;
const music = document.getElementById("bgMusic");

function startSequence() {
  music.play().catch(() => {});
  document.getElementById("startView").style.display = "none";
  startCount();
}

function startCount() {
  let i = 1;
  const el = document.getElementById("count");
  el.style.display = "block";

  const interval = setInterval(() => {
    el.textContent = i++;
    if (i > 3) {
      clearInterval(interval);
      el.style.display = "none";
      typeText();
    }
  }, 900);
}

function typeText() {
  const el = document.getElementById("text");
  el.style.display = "block";

  let i = 0;
  const msg = galleryData.welcomeText;

  const interval = setInterval(() => {
    el.textContent = msg.slice(0, i++);
    if (i > msg.length) {
      clearInterval(interval);
      document.getElementById("messageBox").style.display = "block";
    }
  }, 60);
}

function openGallery() {
  document.getElementById("gallery").style.display = "flex";
  updateCard();
}

function updateCard() {
  const p = galleryData.people[currentIndex];
  document.getElementById("image").src = p.image;
  document.getElementById("name").textContent = p.name;
  document.getElementById("desc").textContent = p.caption;
}

function nextImage() {
  if (currentIndex < galleryData.people.length - 1) {
    currentIndex++;
    updateCard();
  } else {
    document.getElementById("gallery").style.display = "none";
    document.getElementById("endPage").style.display = "flex";
    document.getElementById("endImage").src = galleryData.endImage;
    document.getElementById("endText").textContent = galleryData.endMessage;
  }
}
</script>

</body>
</html>
