<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-gradient: #ffffff;
  --primary-gold: #ffacbf;
  --text-main: #ffffff;
  --text-muted: #6b6b6b;
  --panel-bg: rgba(255, 255, 255, 0.6);
  --panel-border: rgba(255, 172, 191, 0.25);
  --btn-bg: #ffacbf;
  --btn-hover: #ff8fb1;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  font-family:'Poppins','Cairo',sans-serif;
  overflow:hidden;
}

#starCanvas {
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

.container {
  z-index:10;
  text-align:center;
}

.btn {
  padding:16px 36px;
  border:none;
  border-radius:50px;
  background:var(--btn-bg);
  font-weight:700;
  cursor:pointer;
}

#count {
  font-size:120px;
  color:#ff79b9;
  display:none;
}

#text {
  font-size:20px;
  margin-top:20px;
  color:#fff;
  display:none;
  white-space:pre-line;
}

/* BOOK */
.book-container {
  perspective:2000px;
  width:340px;
  height:500px;
}

.book-page {
  width:100%;
  height:100%;
  background:#fff;
  border-radius:12px;
  transform-origin:left;
  transition:1s;
  overflow:hidden;
  cursor:pointer;
}

.book-page.flipping {
  transform:rotateY(-180deg);
}

.page-front {
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.book-image {
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:10px;
}

#desc {
  margin-top:15px;
  font-size:20px;
  font-weight:600;
  color:#333;
  text-align:center;
}

</style>
</head>

<body>

<canvas id="starCanvas"></canvas>

<audio id="bgMusic" loop>
  <source src="https://mp3tourl.com/audio/1778104889205-d3f1bf97-6ff6-4de5-be39-7b816d0753d0.m4a">
</audio>

<div class="container">

  <div id="startView">
    <button class="btn" onclick="startSequence()">Start</button>
  </div>

  <div id="count"></div>
  <div id="text"></div>

  <div id="gallery" style="display:none;">
    <div class="book-container">
      <div class="book-page" id="bookPage" onclick="nextImage()">
        <div class="page-front">
          <img id="image" class="book-image">
          <div id="desc"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="galleryData.js"></script>

<script>
const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");
let stars=[];

function init(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  for(let i=0;i<120;i++){
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      s:Math.random()*2,
      v:Math.random()*0.5
    });
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ff0062";
  stars.forEach(st=>{
    ctx.beginPath();
    ctx.arc(st.x,st.y,st.s,0,Math.PI*2);
    ctx.fill();
    st.y-=st.v;
    if(st.y<0) st.y=canvas.height;
  });
  requestAnimationFrame(draw);
}

init(); draw();

let music=document.getElementById("bgMusic");
let i=0;
let currentIndex=0;

function startSequence(){
  music.play().catch(()=>{});
  document.getElementById("startView").style.display="none";
  startCount();
}

function startCount(){
  const el=document.getElementById("count");
  el.style.display="block";
  let n=1;

  let int=setInterval(()=>{
    el.textContent=n;
    n++;
    if(n>3){
      clearInterval(int);
      el.style.display="none";
      typeText();
    }
  },900);
}

function typeText(){
  const el=document.getElementById("text");
  const text=galleryData.welcomeText;
  el.style.display="block";
  let i=0;

  let int=setInterval(()=>{
    el.textContent=text.slice(0,i);
    i++;
    if(i>text.length){
      clearInterval(int);
      setTimeout(openGallery,1000);
    }
  },60);
}

function openGallery(){
  document.getElementById("text").style.display="none";
  document.getElementById("gallery").style.display="block";
  updateCard();
}

function updateCard(){
  let p=galleryData.m3aida[currentIndex];
  document.getElementById("image").src=p.image;
  document.getElementById("desc").textContent=p.caption;
}

function nextImage(){
  const page=document.getElementById("bookPage");
  page.classList.add("flipping");

  setTimeout(()=>{
    if(currentIndex<galleryData.m3aida.length-1){
      currentIndex++;
      updateCard();
      page.classList.remove("flipping");
    } else {
      alert(galleryData.endMessage);
    }
  },800);
}
</script>

</body>
</html>
