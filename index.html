<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-gradient: linear-gradient(135deg, #89c2ff, #b8a4ff);
  --primary-gold: #8ab4ff;
  --text-main: #ffffff;
  --text-muted: #6b6b6b;
  --panel-bg: rgba(255, 255, 255, 0.55);
  --panel-border: rgba(138, 180, 255, 0.25);
  --btn-bg: linear-gradient(135deg, #7fb3ff, #b38cff);
  --btn-hover: linear-gradient(135deg, #6aa5ff, #a06fff);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: var(--bg-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  overflow: auto;
  font-family: 'Poppins', 'Cairo', sans-serif;
  perspective: 1000px;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s var(--ease-in-out);
  z-index: 999;
}

#overlay.active {
  opacity: 1;
}

#starCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.container {
  width: 90%;
  max-width: 550px;
  text-align: center;
  z-index: 10;
  position: relative;
}

.btn {
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  padding: 16px 36px;
  border-radius: 50px;
  border: none;
  background: var(--btn-bg);
  color: #0f172a;
  cursor: pointer;
  transition: all 0.4s var(--ease-in-out);
  font-size: 18px;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
  position: relative;
  overflow: hidden;
}

.btn:hover {
  background: var(--btn-hover);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
}

#count {
  font-size: 120px;
  font-weight: 700;
  color: var(--primary-gold);
  text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
  opacity: 0;
  display: none;
  transform: scale(0.5);
  transition: all 0.5s var(--ease-in-out);
}

#count.show {
  display: block;
  opacity: 1;
  transform: scale(1);
}

#count.hide {
  opacity: 0;
  transform: scale(1.5);
}

#text {
  font-size: 20px;
  margin-top: 20px;
  min-height: 50px;
  font-weight: 500;
  white-space: pre-line;
  direction: rtl;
  color: var(--text-main);
  text-shadow: 0 0 8px rgba(255, 0, 98, 0.6),
               0 0 20px rgba(255, 0, 98, 0.4),
               0 0 35px rgba(255, 0, 98, 0.2);
  opacity: 0;
  display: none;
  transition: opacity 0.5s var(--ease-in-out);
}

#text.show {
  display: block;
  opacity: 1;
}

.message {
  margin-top: 30px;
  padding: 30px;
  border-radius: 20px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  cursor: pointer;
  transition: all 0.4s var(--ease-in-out);
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  font-size: 20px;
  color: #ffffff;
  backdrop-filter: blur(10px);
  opacity: 0;
  display: none;
  transform: translateY(20px);
  direction: rtl;
}

.message.show {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

#gallery {
  opacity: 0;
  display: none;
  transform: rotateX(-10deg);
  transition: all 0.8s var(--ease-in-out);
}

#gallery.show {
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 1;
  transform: rotateX(0deg);
}

.image-container {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  overflow: hidden;
  margin: 20px auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  border: 4px solid var(--panel-border);
  position: relative;
  background: rgba(255, 255, 255, 0.1);
}

#image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
  opacity: 1;
  transform: scale(1);
}

#image.fade-out {
  opacity: 0;
  transform: scale(0.9) translateY(10px); 
}

#cardText {
  margin-top: 20px;
  padding: 15px 20px;
  background: rgba(255,255,255,0.04);
  border-radius: 15px;
  border: 1px solid var(--panel-border);
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: all 0.5s ease;
}

#name {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary-gold);
  margin-bottom: 5px;
}

#desc {
  font-size: 16px;
  color: var(--text-muted);
  line-height: 1.6;
}

#endPage {
  position: fixed;
  inset: 0;
  background: transparent;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 25px;
  text-align: center;
  z-index: 999;
}

#endPage.active {
  display: flex;
}

#endImage {
  width: 260px;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(255,0,0,0.2);
}
</style>
</head>

<body>

<canvas id="starCanvas"></canvas>
<div id="overlay"></div>

<audio id="bgMusic" loop>
  <source src="https://mp3tourl.com/audio/1778104889205-d3f1bf97-6ff6-4de5-be39-7b816d0753d0.m4a" type="audio/mpeg">
</audio>

<div class="container">

  <div id="startView" class="view active">
    <button class="btn" onclick="startSequence()">Start</button>
  </div>

  <div id="count"></div>
  <div id="text"></div>
  <div id="messageBox" class="message" onclick="openGallery()">Go to the messages</div>

  <div id="gallery">
    <div class="image-container"><img id="image"></div>
    <div id="cardText">
      <div id="name"></div>
      <div id="desc"></div>
    </div>
    <br>
    <button class="btn" onclick="nextImage()">next ➔</button>
  </div>
</div>

<div id="endPage">
  <img id="endImage">
  <div id="endText"></div>
</div>

<script src="gallery.js"></script>

<script>
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];

function initStars() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2,
      opacity: Math.random(),
      speed: Math.random() * 0.5 + 0.1
    });
  }
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff0062';

  stars.forEach(s => {
    ctx.globalAlpha = s.opacity;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    s.y -= s.speed;
    if (s.y < 0) s.y = canvas.height;
  });

  requestAnimationFrame(drawStars);
}

window.addEventListener('resize', initStars);
initStars();
drawStars();
</script>

</body>
</html>
