<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real Book</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

:root{
  --pink:#ffb8ca;
  --pink-dark:#ff8eaf;
  --paper:#fffdfb;
  --paper-2:#fff7f9;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
  overflow:hidden;
  font-family:'Poppins','Cairo',sans-serif;
}

#starCanvas{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

.container{
  position:relative;
  z-index:5;
}

.btn{
  padding:16px 42px;
  border:none;
  border-radius:50px;
  background:var(--pink);
  color:white;
  font-size:1.1rem;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 25px rgba(255,184,202,.35);
}

.btn:hover{
  transform:scale(1.05);
  background:var(--pink-dark);
}

#count{
  display:none;
  font-size:120px;
  color:var(--pink-dark);
  text-align:center;
  font-weight:700;
}

.book{
  position:relative;
  width:430px;
  height:620px;
  perspective:5000px;
  display:none;
}

.book-base{
  position:absolute;
  inset:0;
  border-radius:22px;
  background:linear-gradient(135deg,#ffd0dc,#ffabc1);

  box-shadow:
  0 25px 55px rgba(255,170,190,.45),
  0 10px 20px rgba(0,0,0,.08);
}

.book-pages{
  position:absolute;
  inset:16px;
  border-radius:16px;
  overflow:hidden;
  background:var(--paper);
}

.book-spine{
  position:absolute;
  left:0;
  top:0;
  width:14px;
  height:100%;
  background:
  linear-gradient(
    to right,
    rgba(0,0,0,.15),
    rgba(255,255,255,.9),
    rgba(0,0,0,.1)
  );

  z-index:50;
}

.page{
  position:absolute;
  inset:0;
  transform-origin:left;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.77,0,.18,1);
  cursor:pointer;
}

.page.flipped{
  transform:rotateY(-180deg);
}

.page-front,
.page-back{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  background:var(--paper);
  padding:28px;
}

.page-back{
  transform:rotateY(180deg);
  background:var(--paper-2);
}

.page-front::before,
.page-back::before{
  content:'';
  position:absolute;
  inset:0;
  background:
  linear-gradient(
    to right,
    rgba(0,0,0,.03),
    transparent 20%
  );

  pointer-events:none;
}

.page-content{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.page-image{
  width:100%;
  height:340px;
  object-fit:cover;
  border-radius:14px;

  box-shadow:
  0 12px 30px rgba(0,0,0,.15);
}

.page-text{
  margin-top:28px;
  color:#555;
  line-height:2;
  font-size:19px;
  text-align:center;
  font-weight:500;
}

.tap{
  margin-top:auto;
  color:#ff96b6;
  font-size:15px;
}

.page-number{
  position:absolute;
  bottom:20px;
  right:25px;
  color:#d0a0af;
  font-size:14px;
}

.paper-stack{
  position:absolute;
  right:8px;
  top:8px;
  width:100%;
  height:100%;
  border-radius:18px;
  background:
  repeating-linear-gradient(
    to bottom,
    #fff,
    #fff 2px,
    #f7f7f7 3px
  );

  z-index:-1;
}

@media(max-width:500px){

  .book{
    width:92vw;
    height:620px;
  }

}

</style>
</head>

<body>

<canvas id="starCanvas"></canvas>

<audio id="bgMusic" loop>
<source src="https://mp3tourl.com/audio/1778104889205-d3f1bf97-6ff6-4de5-be39-7b816d0753d0.m4a">
</audio>

<div class="container">

<div id="startView">
<button class="btn" onclick="startSequence()">
Start
</button>
</div>

<div id="count"></div>

<div class="book" id="book">

<div class="book-base"></div>

<div class="paper-stack"></div>

<div class="book-pages">

<div class="book-spine"></div>

<div class="page" id="page" onclick="flipPage()">

<div class="page-front">

<div class="page-content">

<img id="pageImage" class="page-image">

<div class="page-text" id="desc"></div>

<div class="tap">
الصفحة الي بعدها →
</div>

</div>

<div class="page-number" id="frontNum">
1
</div>

</div>

<div class="page-back">

<div class="page-content">

<img id="pageImageBack" class="page-image">

<div class="page-text">
♥
</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

const galleryData = [
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام اللي يظهر مع الصورة الأولى"
  },
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام للصورة الثانية"
  },
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام للصورة الثالثة"
  }
];


const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");

let stars=[];

function initStars(){

canvas.width=innerWidth;
canvas.height=innerHeight;

stars=[];

for(let i=0;i<120;i++){

stars.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
s:Math.random()*2.5,
v:Math.random()*0.4+.15

});

}

}

function animateStars(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#ffb6c9";

stars.forEach(st=>{

ctx.beginPath();
ctx.arc(st.x,st.y,st.s,0,Math.PI*2);
ctx.fill();

st.y-=st.v;

if(st.y<0){

st.y=canvas.height;
st.x=Math.random()*canvas.width;

}

});

requestAnimationFrame(animateStars);

}

window.addEventListener("resize",initStars);

initStars();
animateStars();



const music = document.getElementById("bgMusic");

let currentIndex = 0;
let flipping = false;

function startSequence(){

music.play().catch(()=>{});

document.getElementById("startView").style.display="none";

startCount();

}

function startCount(){

const el=document.getElementById("count");

el.style.display="block";

let n=1;

const interval=setInterval(()=>{

el.textContent=n;

if(n>=3){

clearInterval(interval);

setTimeout(()=>{

el.style.display="none";

document.getElementById("book").style.display="block";

updateBook();

},500);

}

n++;

},700);

}

function updateBook(){

const item = galleryData[currentIndex];

document.getElementById("pageImage").src=item.image;

document.getElementById("pageImageBack").src=item.image;

document.getElementById("desc").textContent=item.caption;

document.getElementById("frontNum").textContent=
`${currentIndex+1}`;

}

function flipPage(){

if(flipping) return;

flipping=true;

const page=document.getElementById("page");

page.classList.add("flipped");

setTimeout(()=>{

currentIndex++;

if(currentIndex>=galleryData.length){

currentIndex=0;

}

updateBook();

},260);

setTimeout(()=>{

page.classList.remove("flipped");

flipping=false;

},560);

}

</script>

</body>
</html>
