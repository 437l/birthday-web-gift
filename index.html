<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary-pink: #ffacbf;
  --btn-bg: #ffacbf;
  --btn-hover: #ff8fb1;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  font-family:'Poppins','Cairo',sans-serif;
  overflow:hidden;
}

#starCanvas {
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

.container {
  z-index:10;
  text-align:center;
}

.btn {
  padding:16px 40px;
  border:none;
  border-radius:50px;
  background:var(--btn-bg);
  color: white;
  font-weight:700;
  font-size: 1.2rem;
  cursor:pointer;
  transition: 0.3s;
}

.btn:hover { background: var(--btn-hover); }

#count {
  font-size:120px;
  color:#ff79b9;
  display:none;
}


.book-container {
  perspective:2000px;
  width:340px;
  height:500px;
  margin: 0 auto;
}

.book-page {
  width:100%;
  height:100%;
  background:#fff;
  border-radius:15px;
  transform-origin:left;
  transition:0.8s ease-in-out;
  overflow:hidden;
  cursor:pointer;
  box-shadow: 0 15px 35px rgba(255, 172, 191, 0.3);
  border: 1px solid #ffeef2;
}

.book-page.flipping {
  transform:rotateY(-180deg);
  opacity: 0;
}

.page-front {
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  height: 100%;
}

.book-image {
  width:100%;
  height:320px;
  object-fit:cover;
  border-radius:10px;
}

#desc {
  margin-top:25px;
  font-size:18px;
  font-weight:600;
  color:#444;
  text-align:center;
  line-height: 1.6;
}
</style>
</head>

<body>

<canvas id="starCanvas"></canvas>

<audio id="bgMusic" loop>
  <source src="https://mp3tourl.com/audio/1778104889205-d3f1bf97-6ff6-4de5-be39-7b816d0753d0.m4a">
</audio>

<div class="container">

  <div id="startView">
    <button class="btn" onclick="startSequence()">Start</button>
  </div>


  <div id="count"></div>


  <div id="gallery" style="display:none;">
    <div class="book-container">
      <div class="book-page" id="bookPage" onclick="nextImage()">
        <div class="page-front">
          <img id="image" class="book-image">
          <div id="desc"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

const galleryData = [
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام اللي يظهر مع الصورة الأولى"
  },
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام للصورة الثانية"
  },
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام للصورة الثالثة"
  }
];


const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");
let stars=[];

function init(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  stars = [];
  for(let i=0;i<120;i++){
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      s:Math.random()*3,
      v:Math.random()*0.5 + 0.2
    });
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ffacbf";
  stars.forEach(st=>{
    ctx.beginPath();
    ctx.arc(st.x,st.y,st.s,0,Math.PI*2);
    ctx.fill();
    st.y-=st.v;
    if(st.y<0) st.y=canvas.height;
  });
  requestAnimationFrame(draw);
}

window.addEventListener('resize', init);
init(); draw();


let music = document.getElementById("bgMusic");
let currentIndex = 0;

function startSequence(){
  music.play().catch(e => console.log("Audio play failed"));
  document.getElementById("startView").style.display = "none";
  startCount();
}

function startCount(){
  const el = document.getElementById("count");
  el.style.display = "block";
  let n = 1;

  let interval = setInterval(() => {
    el.textContent = n;
    if(n >= 3){
      clearInterval(interval);
      setTimeout(() => {
        el.style.display = "none";
        openGallery(); 
      }, 600);
    }
    n++;
  }, 900);
}

function openGallery(){
  document.getElementById("gallery").style.display = "block";
  updateCard();
}

function updateCard(){
  let item = galleryData[currentIndex];
  document.getElementById("image").src = item.image;
  document.getElementById("desc").textContent = item.caption;
}

function nextImage(){
  const page = document.getElementById("bookPage");
  
  if(currentIndex < galleryData.length - 1){
    page.classList.add("flipping");
    setTimeout(()=>{
      currentIndex++;
      updateCard();
      page.classList.remove("flipping");
    },500);
  } else {
    currentIndex = 0;
    updateCard();
  }
}
</script>

</body>
</html>
