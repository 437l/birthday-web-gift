<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Book</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ffb8ca;
  --pink2:#ff8fad;
  --paper:#fffdfc;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:auto;
  background:radial-gradient(circle at top,#ffe7ef,#fff);
  font-family:'Poppins','Cairo',sans-serif;
}

#starCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

.container{
  position:relative;
  z-index:10;
  text-align:center;
}

.btn{
  padding:16px 44px;
  border:none;
  border-radius:60px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;
  font-size:1.1rem;
  font-weight:700;
}

#count{
  display:none;
  font-size:120px;
  color:var(--pink2);
  font-weight:700;
}

.book-scene{
  perspective:4000px;
  display:none;
}

.book{
  width:380px;
  height:540px;
  transform-style:preserve-3d;
  transform:rotateX(10deg) rotateY(-18deg);
  position:relative;
}

.book-cover{
  position:absolute;
  inset:0;
  border-radius:16px;
  background:linear-gradient(135deg,#ffd0dc,#ffb2c6);
  box-shadow:0 30px 60px rgba(0,0,0,.18);
}

.book-pages{
  position:absolute;
  inset:12px;
  background:var(--paper);
  border-radius:10px;
  overflow:hidden;
}

.page{
  position:absolute;
  inset:0;
  transform-origin:left;
  transform-style:preserve-3d;
  transition:.8s ease;
}

.page.flipped{
  transform:rotateY(-180deg);
}

.page-front,.page-back{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

.page-back{
  transform:rotateY(180deg);
}

.page-image{
  width:100%;
  height:320px;
  object-fit:cover;
  border-radius:12px;
}

.page-text{
  margin-top:12px;
  text-align:center;
  color:#555;
  font-size:14px;
  line-height:1.8;
  max-height:120px;
  overflow:auto;
}

.end-page{
  display:none;
  height:100%;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:26px;
  color:#ff8fad;
}

.tap{
  margin-top:auto;
  color:#ff8fad;
  font-size:12px;
}

</style>
</head>

<body>

<canvas id="starCanvas"></canvas>

<audio id="bgMusic" loop>
<source src="https://mp3tourl.com/audio/1778104889205-d3f1bf97-6ff6-4de5-be39-7b816d0753d0.m4a">
</audio>

<div class="container">

<div id="startView">
<button class="btn" onclick="startSequence()">Start</button>
</div>

<div id="count"></div>

<div class="book-scene" id="bookScene">

<div class="book">
<div class="book-cover"></div>

<div class="book-pages">

<div class="page" id="page" onclick="flipPage()">

<div class="page-front" id="front">

<img id="pageImage" class="page-image"/>
<div class="page-text" id="desc"></div>
<div class="tap">الصفحة الي بعدها →</div>

</div>

<div class="page-back">

<div class="page-text" style="margin-top:60px;">♥</div>

</div>

</div>

<div class="end-page" id="endPage">
<div id="typeText"></div>
</div>

</div>
</div>

</div>
</div>

<script>

const galleryData = [
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام اللي يظهر مع الصورة الأولى"
  },
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام للصورة الثانية"
  },
  {
    image: "https://i.imgur.com/Nmwgm8m.jpeg",
    caption: "هنا الكلام للصورة الثالثة"
  }
];


let i=0;
let flipping=false;
const music=document.getElementById("bgMusic");

document.addEventListener("click",()=>music.play().catch(()=>{}),{once:true});

function startSequence(){
document.getElementById("startView").style.display="none";
startCount();
}

function startCount(){
const el=document.getElementById("count");
el.style.display="block";
let n=1;
let t=setInterval(()=>{
el.textContent=n;
if(n>=3){
clearInterval(t);
setTimeout(()=>{
el.style.display="none";
document.getElementById("bookScene").style.display="block";
update();
},400);
}
n++;
},600);
}

function update(){
if(i>=galleryData.length){
showEnd();
return;
}
const item=galleryData[i];
document.getElementById("pageImage").src=item.image;
document.getElementById("desc").textContent=item.caption;
}

function flipPage(){
if(flipping) return;
flipping=true;

const page=document.getElementById("page");
page.classList.add("flipped");

setTimeout(()=>{
i++;
update();
},400);

setTimeout(()=>{
page.classList.remove("flipped");
flipping=false;
},800);
}

function showEnd(){

document.getElementById("page").style.display="none";

document.getElementById("endPage").style.display="flex";

typeWriter("الرسالة اخر شي هون", 0);

}

function typeWriter(text,i){

if(i===0){

document.getElementById("typeText").innerHTML="";

}

if(i<text.length){

document.getElementById("typeText").innerHTML+=text.charAt(i);

setTimeout(()=>typeWriter(text,i+1),60);

}

}

</script>

</body>
</html>
